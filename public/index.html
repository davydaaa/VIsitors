<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продані квитки RELUX</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --primary: #0d6efd;
            --border: #dee2e6;
            --radius: 12px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        h2 { font-size: 1.25rem; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;}
        .controls {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }
        input[type="date"] {
            padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem;
        }
        button {
            padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }
        
        /* Стилі для фільтрів */
        .filters {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .filters-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .cb-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }
        input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .total-box {
            font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-top: 16px;
        }
        .session-item {
            display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .session-item:last-child { border-bottom: none; }
        .session-time { font-weight: bold; width: 60px; flex-shrink: 0; }
        .session-name { flex-grow: 1; padding: 0 12px; }
        .session-hall { font-size: 0.85em; color: var(--text-muted); margin-right: 8px; }
        .session-sold { font-weight: 600; color: var(--primary); white-space: nowrap; }
        
        #loading { display: none; margin-top: 16px; color: var(--text-muted); }
        #results { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Обрати дату</h1>
        <div class="controls">
            <input type="date" id="datePicker">
            <button id="fetchBtn" onclick="fetchData()">Оновити</button>
        </div>

        <div class="filters">
            <div class="filters-title">Фільтр залів:</div>
            <div class="checkbox-group">
                <label class="cb-label"><input type="checkbox" id="filterAll" checked onchange="toggleAll()"> Усі зали</label>
                <label class="cb-label"><input type="checkbox" value="1" class="hall-cb" disabled onchange="toggleSingle()"> Зал 1</label>
                <label class="cb-label"><input type="checkbox" value="2" class="hall-cb" disabled onchange="toggleSingle()"> Зал 2</label>
                <label class="cb-label"><input type="checkbox" value="3" class="hall-cb" disabled onchange="toggleSingle()"> Зал 3</label>
                <label class="cb-label"><input type="checkbox" value="4" class="hall-cb" disabled onchange="toggleSingle()"> Зал 4</label>
                <label class="cb-label"><input type="checkbox" value="5" class="hall-cb" disabled onchange="toggleSingle()"> Зал 5</label>
                <label class="cb-label"><input type="checkbox" value="6" class="hall-cb" disabled onchange="toggleSingle()"> Зал 6</label>
            </div>
        </div>

        <div id="loading">Завантаження... Це може зайняти до хвилини ⏳</div>
    </div>

    <div id="results">
        <div class="card">
            <h2>До кінця дня</h2>
            <div class="total-box">Загалом продано: <span id="totalTickets">0</span></div>
        </div>

        <div class="card" id="chronologicalView">
        </div>

        <div class="card" id="groupedView">
        </div>
    </div>
</div>

<script>
    document.getElementById('datePicker').valueAsDate = new Date();

    // Зберігаємо завантажені дані глобально, щоб миттєво фільтрувати без нових запитів
    let globalData = null; 

    function toggleAll() {
        const isAll = document.getElementById('filterAll').checked;
        const cbs = document.querySelectorAll('.hall-cb');
        cbs.forEach(cb => {
            cb.disabled = isAll;
            if (isAll) cb.checked = false;
        });
        if (globalData) renderData();
    }

    function toggleSingle() {
        if (globalData) renderData();
    }

    async function fetchData() {
        const date = document.getElementById('datePicker').value;
        if (!date) return alert("Оберіть дату!");

        const btn = document.getElementById('fetchBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        btn.disabled = true;
        loading.style.display = 'block';
        results.style.display = 'none';
        
        try {
            const response = await fetch(`/api/tickets?date=${date}`);
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            globalData = data; 
            renderData(); // Викликаємо функцію малювання екрану
            
            results.style.display = 'block';
        } catch (error) {
            alert("Помилка: " + error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    // Функція, яка перевіряє, чи підходить зал під наші обрані чекбокси
    function keepHall(hallName) {
        const isAll = document.getElementById('filterAll').checked;
        if (isAll) return true;

        // Збираємо значення (цифри) з усіх обраних чекбоксів
        const selectedNums = Array.from(document.querySelectorAll('.hall-cb:checked')).map(cb => cb.value);
        if (selectedNums.length === 0) return false;

        // Якщо назва залу (напр. "LUX 5") містить одну з обраних цифр — показуємо його
        return selectedNums.some(num => hallName.includes(num));
    }

    function renderData() {
        if (!globalData) return;
        const data = globalData;

        let filteredTotal = 0;
        
        // 1. Хронологічний розклад
        let chronoHtml = `<h2>Хронологічний розклад</h2>`;
        data.chronological.forEach(s => {
            if (keepHall(s.hall)) {
                filteredTotal += s.sold;
                chronoHtml += `
                    <div class="session-item">
                        <div class="session-time">${s.time}</div>
                        <div class="session-name">
                            <span class="session-hall">[${s.hall}]</span>${s.movieName}
                        </div>
                        <div class="session-sold">${s.sold} шт.</div>
                    </div>
                `;
            }
        });

        // 2. Розклад по залах
        let groupedHtml = `<h2>Розклад по залах</h2>`;
        for (const [hallName, sessions] of Object.entries(data.grouped).sort()) {
            if (keepHall(hallName)) {
                groupedHtml += `<h3 style="margin: 16px 0 8px 0; color: var(--text-muted);">🎬 ${hallName}</h3>`;
                sessions.forEach(s => {
                    groupedHtml += `
                        <div class="session-item">
                            <div class="session-time">${s.time}</div>
                            <div class="session-name">${s.movieName}</div>
                            <div class="session-sold">${s.sold} шт.</div>
                        </div>
                    `;
                });
            }
        }

        // Оновлюємо HTML
        document.getElementById('totalTickets').innerText = filteredTotal;
        document.getElementById('chronologicalView').innerHTML = chronoHtml;
        document.getElementById('groupedView').innerHTML = groupedHtml;
    }
</script>

</body>
</html>
